[package]
name = "buffer_sizing"
version = "0.1.0"
edition = "2021"

[lib]
name = "buffer_sizing"
crate-type = ["cdylib", "lib"]

[dependencies]
grb = "2.*"
mdsdf = { path = "../mdsdf" }
milp_formulation = { path = "../milp_formulation" }
ndarray = "0.15.*"
num = "0.4.*"

[dependencies.pyo3]
version = "0.21.*"
features = ["extension-module"]

[dev-dependencies]
anyhow = "1.*"
sdf3_xml_parser = { path = "../sdf3_xml_parser" }
